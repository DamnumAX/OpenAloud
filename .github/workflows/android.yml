name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'OpenAloud.zip'
      - '.github/workflows/android.yml'
      - 'OpenAloud/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract source archive
        run: |
          test -f OpenAloud.zip
          if [ ! -f OpenAloud/app/build.gradle.kts ]; then unzip -q OpenAloud.zip -d .; fi
          test -f OpenAloud/app/build.gradle.kts

      - name: Commit extracted Android source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OpenAloud
          if ! git diff --cached --quiet; then
            git commit -m "build: add extracted Android source"
            git push
          fi

      - name: Package extracted source for inspection
        run: zip -qr OpenAloud-source.zip OpenAloud

      - name: Upload extracted source
        uses: actions/upload-artifact@v4
        with:
          name: OpenAloud-source
          path: OpenAloud-source.zip
          retention-days: 1

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: OpenAloud
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenAloud-debug
          path: OpenAloud/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
